<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Ground line -->
  <rect x="20" y="252" width="360" height="4" rx="2" fill="#0d5f52" opacity="0.18"/>

  <!-- Truck body -->
  <rect x="150" y="150" width="145" height="95" rx="8" fill="#0d5f52" opacity="0.22"/>
  <rect x="158" y="158" width="129" height="42" rx="4" fill="#0d5f52" opacity="0.10"/>

  <!-- Truck cab -->
  <rect x="295" y="175" width="65" height="70" rx="6" fill="#0d5f52" opacity="0.28"/>
  <rect x="305" y="185" width="45" height="28" rx="4" fill="#e8f4f1" opacity="0.45"/>

  <!-- Truck wheels -->
  <circle cx="195" cy="250" r="17" fill="#0d5f52" opacity="0.30"/>
  <circle cx="195" cy="250" r="8" fill="#e8f4f1" opacity="0.25"/>
  <circle cx="330" cy="250" r="17" fill="#0d5f52" opacity="0.30"/>
  <circle cx="330" cy="250" r="8" fill="#e8f4f1" opacity="0.25"/>

  <!-- Items in truck bed -->
  <rect x="165" y="120" width="28" height="35" rx="3" fill="#d97706" opacity="0.25"/>
  <rect x="200" y="125" width="24" height="30" rx="2" fill="#0d5f52" opacity="0.18"/>
  <rect x="230" y="118" width="20" height="37" rx="2" fill="#d97706" opacity="0.20"/>
  <rect x="255" y="122" width="26" height="33" rx="3" fill="#0d5f52" opacity="0.15"/>

  <!-- Boxes on ground -->
  <rect x="55" y="208" width="42" height="38" rx="4" fill="#0d5f52" opacity="0.22"/>
  <rect x="60" y="214" width="32" height="8" rx="2" fill="#e8f4f1" opacity="0.18"/>
  <rect x="100" y="218" width="35" height="28" rx="3" fill="#d97706" opacity="0.20"/>

  <!-- Motion arrows -->
  <line x1="120" y1="230" x2="148" y2="218" stroke="#0d5f52" stroke-width="2.5" stroke-linecap="round" opacity="0.18" stroke-dasharray="5 3"/>
  <line x1="115" y1="215" x2="148" y2="200" stroke="#0d5f52" stroke-width="2" stroke-linecap="round" opacity="0.15" stroke-dasharray="5 3"/>

  <!-- Checkmark badge -->
  <circle cx="75" cy="80" r="22" fill="#0d5f52" opacity="0.15"/>
  <path d="M64 80l8 8 14-15" stroke="#0d5f52" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.30"/>

  <!-- Decorative -->
  <circle cx="350" cy="95" r="7" fill="#d97706" opacity="0.18"/>
  <circle cx="45" cy="140" r="4" fill="#0d5f52" opacity="0.12"/>
  <circle cx="375" cy="145" r="5" fill="#d97706" opacity="0.12"/>
</svg>
