<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Ground -->
  <rect x="20" y="255" width="360" height="4" rx="2" fill="#0d5f52" opacity="0.18"/>

  <!-- Main tree trunk -->
  <rect x="172" y="135" width="26" height="120" rx="5" fill="#0d5f52" opacity="0.30"/>
  <line x1="180" y1="155" x2="180" y2="250" stroke="#0d5f52" stroke-width="1" opacity="0.12"/>
  <line x1="192" y1="148" x2="192" y2="248" stroke="#0d5f52" stroke-width="1" opacity="0.10"/>

  <!-- Tree canopy -->
  <ellipse cx="185" cy="105" rx="78" ry="58" fill="#0d5f52" opacity="0.18"/>
  <ellipse cx="168" cy="85" rx="58" ry="45" fill="#0d5f52" opacity="0.14"/>
  <ellipse cx="208" cy="80" rx="52" ry="40" fill="#0d5f52" opacity="0.12"/>
  <ellipse cx="185" cy="65" rx="38" ry="30" fill="#0d5f52" opacity="0.10"/>

  <!-- Branch being trimmed -->
  <line x1="198" y1="165" x2="265" y2="145" stroke="#0d5f52" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
  <line x1="245" y1="150" x2="278" y2="130" stroke="#0d5f52" stroke-width="3" stroke-linecap="round" opacity="0.18"/>

  <!-- Cut marks -->
  <line x1="258" y1="141" x2="270" y2="150" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.30"/>
  <line x1="261" y1="139" x2="267" y2="153" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.30"/>

  <!-- Fallen branch -->
  <line x1="270" y1="238" x2="355" y2="232" stroke="#0d5f52" stroke-width="6" stroke-linecap="round" opacity="0.22"/>
  <line x1="300" y1="234" x2="322" y2="222" stroke="#0d5f52" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <line x1="315" y1="233" x2="330" y2="243" stroke="#0d5f52" stroke-width="2.5" stroke-linecap="round" opacity="0.15"/>

  <!-- Stump -->
  <rect x="52" y="232" width="34" height="23" rx="4" fill="#0d5f52" opacity="0.25"/>
  <ellipse cx="69" cy="232" rx="19" ry="6" fill="#0d5f52" opacity="0.18"/>
  <circle cx="69" cy="238" r="7" fill="none" stroke="#0d5f52" stroke-width="1" opacity="0.12"/>
  <circle cx="69" cy="238" r="3" fill="#0d5f52" opacity="0.10"/>

  <!-- Chainsaw -->
  <rect x="290" y="188" width="52" height="16" rx="3" fill="#d97706" opacity="0.28"/>
  <rect x="342" y="184" width="28" height="24" rx="4" fill="#d97706" opacity="0.22"/>
  <path d="M290 193l-13 4v6l13 5" fill="#0d5f52" opacity="0.18"/>

  <!-- Leaf scatter -->
  <ellipse cx="48" cy="158" rx="6" ry="3" fill="#0d5f52" opacity="0.15" transform="rotate(-30 48 158)"/>
  <ellipse cx="325" cy="115" rx="5" ry="2.5" fill="#0d5f52" opacity="0.12" transform="rotate(25 325 115)"/>
  <ellipse cx="128" cy="195" rx="5" ry="2.5" fill="#0d5f52" opacity="0.10" transform="rotate(-15 128 195)"/>

  <!-- Decorative -->
  <circle cx="42" cy="68" r="6" fill="#d97706" opacity="0.18"/>
  <circle cx="358" cy="85" r="8" fill="#0d5f52" opacity="0.14"/>
</svg>
